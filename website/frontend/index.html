
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BISINDO Recognition</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>BISINDO Recognition</h1>

    <div class="container">

        <video id="webcam" autoplay playsinline></video>

        <div class="result">

            <h2 id="prediction">Waiting...</h2>
            <p id="confidence">Confidence: --</p>

        </div>

        <button id="startButton">Start Webcam</button>
        <button id="stopButton">Stop Webcam</button>

        <p id="status">Camera is not running</p>

    </div>

    <script src="script.js"></script>

</body>

</html>
